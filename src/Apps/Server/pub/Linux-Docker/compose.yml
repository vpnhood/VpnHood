services:
  # One container and no updater beside it: the image updates itself (vhsupervisor.sh), as it must
  # where a service takes a single container and gives no docker.sock.
  vpnhoodserver:
    image: vpnhood/vpnhoodserver
    container_name: VpnHoodServer
    network_mode: "host"
    restart: always
    stop_grace_period: 30s
    # the console log, capped: Docker keeps it forever otherwise; the server's own logs are in storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
        - /opt/VpnHoodServer/storage:/app/storage
