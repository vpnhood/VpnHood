name: _build_app_windows (reusable)

# Builds the Windows MSI (client/connect) from the vpnhood/VpnHood monorepo (checked out into code/).
# Called by publish_app.yml. Two-stage publish/package for clearer CI logs. Uploads `<app>-windows`.
# ADVANCED_INSTALLER_LICENSE missing -> skipped-with-warning (green, no artifact). AZURE_SIGNING_* is
# optional as a PAIR: both present -> signed; both absent -> unsigned + warning; exactly one present
# -> the build FAILS, because a half-configured signer ships an unsigned installer from a green run.
# Secrets arrive via `secrets: inherit`.

on:
  workflow_call:
    inputs:
      app:
        description: "client | connect"
        type: string
        required: true
      code_ref:
        type: string
        required: false
        default: ""

env:
  CODE_REPO: vpnhood/VpnHood

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      PKG: ${{ inputs.app == 'connect' && 'VpnHoodConnect' || 'VpnHoodClient' }}
      PREFIX: ${{ inputs.app == 'connect' && 'Connect' || 'Client' }}
      # The release repo drives every generated install/update URL (Resolve-PublishRepo otherwise falls
      # back to GITHUB_REPOSITORY, i.e. the CALLER). When the publishing repo is not the release repo —
      # the client publishes from Vpnhood.App.Client but releases into vpnhood/VpnHood — the BUILDS must
      # honour the same override the release job uses, or the shipped JSON points at a repo with no
      # releases and in-app update breaks with nothing going red.
      VH_PUBLISH_REPO: ${{ inputs.app != 'connect' && (vars.VH_PUBLISH_REPO || github.repository) || '' }}
      VH_CONNECT_PUBLISH_REPO: ${{ inputs.app == 'connect' && (vars.VH_CONNECT_PUBLISH_REPO || vars.VH_PUBLISH_REPO || github.repository) || '' }}
      ADVANCED_INSTALLER_LICENSE: ${{ secrets.ADVANCED_INSTALLER_LICENSE }}
      AZURE_SIGNING_CREDENTIAL: ${{ secrets.AZURE_SIGNING_CREDENTIAL }}
      AZURE_SIGNING_TARGET: ${{ vars.AZURE_SIGNING_TARGET || secrets.AZURE_SIGNING_TARGET }}
      # Connect embeds a default server access key. Keys are per-entitlement: Windows has no ads, so it
      # uses the 'premium' key shared by every ad-free distribution. Empty/unused for the client.
      ACCESS_KEY_PREMIUM: ${{ secrets.ACCESS_KEY_PREMIUM }}
    steps:
      - name: Checkout code (${{ env.CODE_REPO }})
        uses: actions/checkout@v5
        with: { repository: "${{ env.CODE_REPO }}", ref: "${{ inputs.code_ref }}", path: code }
      - uses: actions/setup-dotnet@v5
        with: { global-json-file: code/global.json }
      - name: Resolve module dir
        shell: pwsh
        run: |
          $v = Get-Content "$env:GITHUB_WORKSPACE/code/pub/PubVersion.json" | ConvertFrom-Json
          $tag = "v$($v.Version)" + ($(if ($v.Prerelease) { "-prerelease" } else { "" }))
          "MODULE_DIR=code/pub/bin/$tag/$env:PKG/windows-web" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Warn if Advanced Installer license is missing
        if: env.ADVANCED_INSTALLER_LICENSE == ''
        shell: pwsh
        run: |
          Write-Host "::warning title=Advanced Installer license missing::ADVANCED_INSTALLER_LICENSE is not set; skipping the Windows MSI build. The release will omit the installer."
      - name: Set up Advanced Installer
        if: env.ADVANCED_INSTALLER_LICENSE != ''
        uses: caphyon/advinst-github-action@7edde34c6ff935e53e3de72a5699efcfceb5f6c6 # v2.0.3
        with: { advinst-license: "${{ env.ADVANCED_INSTALLER_LICENSE }}" }
      # Windows has no ads, so it embeds the 'premium' key shared by every ad-free distribution. When the
      # secret is absent nothing is written and the strict guard in the publish script (Assert-DefaultAccessKey)
      # FAILS the build — a Connect installer with no default server opens on an empty server list, which
      # is exactly how 8.1.838-prerelease shipped.
      - name: Write default access key (connect)
        if: env.ADVANCED_INSTALLER_LICENSE != '' && inputs.app == 'connect'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ACCESS_KEY_PREMIUM)) { return }
          $d = Join-Path $env:GITHUB_WORKSPACE ".user/$env:PKG"
          New-Item -ItemType Directory -Path $d -Force | Out-Null
          $env:ACCESS_KEY_PREMIUM | Out-File (Join-Path $d "access_key_premium.txt") -Encoding ascii -Force -NoNewline
      # publish.json is the strict-mode switch (see pub/lib/AppPublishConfig.ps1). Without it the Windows
      # build silently skipped every .user guard, so a missing appsettings/access key went unnoticed.
      - name: Write publish.json
        if: env.ADVANCED_INSTALLER_LICENSE != '' && vars.PUBLISH != ''
        shell: pwsh
        env: { PUBLISH: "${{ vars.PUBLISH }}" }
        run: |
          $u = Join-Path $env:GITHUB_WORKSPACE ".user/$env:PKG"
          New-Item -ItemType Directory -Path $u -Force | Out-Null
          $env:PUBLISH | Out-File (Join-Path $u "publish.json") -Encoding utf8 -Force
      - name: Write appsettings
        if: env.ADVANCED_INSTALLER_LICENSE != ''
        shell: pwsh
        env:
          APPSETTINGS: "${{ vars.APPSETTINGS }}"
          PUBLISH: "${{ vars.PUBLISH }}"
        run: |
          # publish.json (present when the PUBLISH var is set) turns on strict mode, which REQUIRES the
          # shared appsettings — a missing secret must fail the Windows build loudly. Without it (a fork
          # with no PUBLISH var) the build is non-strict, so warn and continue.
          if ([string]::IsNullOrWhiteSpace($env:APPSETTINGS)) {
            if (-not [string]::IsNullOrWhiteSpace($env:PUBLISH)) {
              throw "APPSETTINGS variable is not set, but a strict Windows publish (publish.json present) requires .user/$env:PKG/appsettings.json."
            }
            Write-Host "::warning::APPSETTINGS not set and no publish.json; building Windows with default appsettings."
            return
          }
          $u = Join-Path $env:GITHUB_WORKSPACE ".user/$env:PKG"
          New-Item -ItemType Directory -Path $u -Force | Out-Null
          $env:APPSETTINGS | Out-File (Join-Path $u "appsettings.json") -Encoding utf8 -Force
      - name: Build Windows binary (dotnet publish)
        if: env.ADVANCED_INSTALLER_LICENSE != ''
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/code/src/Apps/$env:PREFIX.Win.Web/_publish.ps1" -stage publish
      - name: Package Windows MSI (Advanced Installer)
        if: env.ADVANCED_INSTALLER_LICENSE != ''
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/code/src/Apps/$env:PREFIX.Win.Web/_publish.ps1" -stage package
      - uses: actions/upload-artifact@v7
        if: env.ADVANCED_INSTALLER_LICENSE != ''
        with:
          name: ${{ inputs.app }}-windows
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.MODULE_DIR }}/**
