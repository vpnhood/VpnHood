name: Bump Version

# The ONLY place the version is bumped. Increments pub/PubVersion.json (+ Directory.Build.props),
# commits, and fast-forwards develop + main (no force). The CHANGELOG is hand-maintained and is
# never rewritten here. Bumping in CI (not on a developer's machine) avoids version-file conflicts
# between developers. See pub/RELEASE-STRATEGY.md.
#
# Optional chaining ("do both"): after bumping it can dispatch the NuGet publish against the freshly
# bumped commit, while that workflow also stays independently dispatchable on its own.
#
# It does NOT chain an APP publish. Every app now publishes from its own brand repo — the client from
# vpnhood/Vpnhood.App.Client, Connect from vpnhood/Vpnhood.App.Connect — and dispatching a workflow
# there from here would need a cross-repo `actions: write` credential this repo deliberately does not
# hold. Use the brand repo's `_publish.ps1`, which prompts for the channel, bumps here, waits, and
# then dispatches the publish with your own gh login. That keeps the version single-sourced in this
# repo while leaving it unable to trigger anything in a brand repo.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Prerelease bump (alpha) instead of a stable release bump"
        type: boolean
        default: true
      mark_only:
        description: "Mark the CURRENT version as a prerelease without incrementing it (implies prerelease)"
        type: boolean
        default: false
      then_publish_nugets:
        description: "After bumping, dispatch the NuGet publish workflow"
        type: boolean
        default: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the bump commit to develop + main
      actions: write    # dispatch the downstream publish workflow(s)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0            # need history to fast-forward main
          persist-credentials: true # so the push uses github.token
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version + push
        shell: pwsh
        run: |
          # mark_only wins: it is the "change the channel, keep the number" case, so it implies
          # prerelease regardless of that checkbox. main is left untouched either way.
          $bump =
            if ("${{ github.event.inputs.mark_only }}" -eq "true") { 3 }
            elseif ("${{ github.event.inputs.prerelease }}" -eq "true") { 2 }
            else { 1 }
          & "$env:GITHUB_WORKSPACE/pub/Invoke-VersionBump.ps1" -bump $bump
      - name: Dispatch NuGet publish
        if: ${{ github.event.inputs.then_publish_nugets == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish_nugets.yml --repo "${{ github.repository }}" --ref develop
