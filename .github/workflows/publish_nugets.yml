name: Publish NuGet Packages

# Packs and pushes all VpnHood NuGet libraries at the version currently in pub/PubVersion.json.
# Standalone: dispatch it on its own whenever you want to (re)publish the libraries. It does NOT bump
# the version — bump first with the "Bump Version" workflow (which can also chain into this one). The
# whole src/ suite shares one version and is published together (see pub/RELEASE-STRATEGY.md);
# packages are normally published as a stable Release version.
#
# Smoke mode: tick "smoke" to validate the whole pack+push pipeline WITHOUT burning a real version —
# it publishes THROWAWAY prerelease packages (e.g. 8.0.825.<run_number>-prerelease). The base
# Major.Minor.Build in PubVersion.json is untouched and nothing is committed.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build the packages from (blank = the branch this is dispatched from)"
        required: false
        default: ""
      smoke:
        description: "Smoke test: publish throwaway prerelease packages (4th revision = run number; base version untouched)"
        type: boolean
        required: false
        default: false

jobs:
  publish-nugets:
    # Only the vpnhood org publishes to nuget.org. Forks skip the whole job (no push attempt, no need
    # for a NuGet key) — packages here share the vpnhood package IDs, so a fork must never push them.
    if: github.repository_owner == 'vpnhood'
    # Windows host is the superset build environment for the packable suite: net*-windows and the WPF
    # library (VpnHood.AppUi.Hosting.WebView.Windows) need Windows, while the net*-android / net*-ios
    # libraries build via workloads (below). Linux cannot build the Windows/WPF projects.
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for nuget.org Trusted Publishing (the NuGet/login step)
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Authenticode signing of the packaged assemblies (SignFiles.ps1) — the same optional
      # all-or-nothing pair as the Windows app build: both present -> signed, both absent ->
      # unsigned (fork-friendly), exactly one -> the publish FAILS.
      AZURE_SIGNING_CREDENTIAL: ${{ secrets.AZURE_SIGNING_CREDENTIAL }}
      AZURE_SIGNING_TARGET: ${{ vars.AZURE_SIGNING_TARGET || secrets.AZURE_SIGNING_TARGET }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.inputs.ref || github.ref_name }}" }
      # The look's package (VpnHood.AppUi.Assets.Classic) is a submodule and ships with the libraries,
      # at the commit this ref pins; fastlane/, the other submodule, stays out.
      - name: Check out the asset submodule
        run: git submodule update --init --depth 1 src/AppUi/VpnHood.AppUi.Assets.Classic
      # The .NET 11 SDK global.json names, for the build...
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      # ...and the .NET 10 SDK the browser page's own global.json names, for the page alone (below).
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: src/AppUi/VpnHood.AppUi.Presentation.Classic.Avalonia.Browser/global.json }
      # The packable set spans net*-android and net*-ios TFMs; install those workloads (for the SDK
      # resolved here, i.e. 11) so `dotnet pack` can build them, and MAUI's for Android and
      # Windows, the TFMs of the MAUI host (VpnHood.AppUi.Hosting.Maui). net*-windows / WPF build
      # natively on Windows.
      - name: Install .NET workloads (android, ios, maui)
        shell: pwsh
        run: dotnet workload install android ios maui-android maui-windows
      # The page the classic UI's package carries (VpnHood.AppUi.Presentation.Classic.Avalonia's
      # buildTransitive/web-root.zip), published first: that pack fails without it. Under the .NET 10
      # SDK the page's own global.json names, with its wasm-tools workload - .NET 11's Emscripten
      # cannot link SkiaSharp's WebAssembly libraries.
      - name: Publish the browser page
        shell: pwsh
        run: |
          Set-Location src/AppUi/VpnHood.AppUi.Presentation.Classic.Avalonia.Browser
          dotnet workload install wasm-tools
          ./_publish.ps1
      # nuget.org Trusted Publishing: the job's OIDC token buys a key valid for one hour, so it is
      # requested right before the publish. The policy (created by trudyhood, package owner vpnhood)
      # names this repo and this file's NAME - renaming the file breaks publishing until it is updated.
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with: { user: trudyhood }
      # In smoke mode Publish-NugetPackages appends github.run_number (ambient $env:GITHUB_RUN_NUMBER on the
      # runner) as the 4th revision segment, so every run gets a unique prerelease version.
      - name: Publish NuGets
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $smoke = "${{ github.event.inputs.smoke }}" -eq "true"
          & "$env:GITHUB_WORKSPACE/pub/lib/Publish-NugetPackages.ps1" -smoke:$smoke
