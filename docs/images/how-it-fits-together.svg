<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="On your device, VpnHood! CLIENT or your own app is built on AppUi, AppHosting, AppLogic, Core and Net; on your server, VpnHood! SERVER or your own server is built on Core and Net; an encrypted tunnel that looks like web traffic joins the two Cores"><style>text{font-family:-apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-size:14px}.b{font-weight:600}.head0{stop-color:#3b2190}.head1{stop-color:#1c0f45}.ui0{stop-color:#8a6dff}.ui1{stop-color:#4a25c9}.hosting0{stop-color:#9f86ff}.hosting1{stop-color:#6142e0}.logic0{stop-color:#b19bff}.logic1{stop-color:#7a5cf2}.core0{stop-color:#4af0d2}.core1{stop-color:#119e87}.net0{stop-color:#ffffff}.net1{stop-color:#e4dcff}.tube0{stop-color:#f6f3ff}.tube1{stop-color:#d9ceff}.c-head .b{fill:#ffffff}.c-head .d{fill:#cfc4ff}.c-ui .b{fill:#ffffff}.c-ui .d{fill:#ebe5ff}.c-hosting .b{fill:#ffffff}.c-hosting .d{fill:#f0ebff}.c-logic .b{fill:#ffffff}.c-logic .d{fill:#f3efff}.c-core .b{fill:#063d34}.c-core .d{fill:#0b4f44}.c-net .b{fill:#1f1640}.c-net .d{fill:#5d5584}.c-net rect{stroke:#d9cfff;stroke-width:1.5}.b{font-weight:700}.tube{fill:url(#g-tube);stroke:#b9a8ff;stroke-width:1}.flow{stroke:#7b5cff;stroke-width:2;stroke-dasharray:7 5}.tl{fill:#5b37e6}.tl2{fill:#5d5584;font-size:12px}.note{fill:#59636e;font-size:12px}@media (prefers-color-scheme: dark){.head0{stop-color:#3b2190}.head1{stop-color:#1c0f45}.ui0{stop-color:#8a6dff}.ui1{stop-color:#4a25c9}.hosting0{stop-color:#9f86ff}.hosting1{stop-color:#6142e0}.logic0{stop-color:#b19bff}.logic1{stop-color:#7a5cf2}.core0{stop-color:#4af0d2}.core1{stop-color:#119e87}.net0{stop-color:#2a2550}.net1{stop-color:#1c1838}.tube0{stop-color:#2a2550}.tube1{stop-color:#1c1838}.c-net .b{fill:#f0ebff}.c-net .d{fill:#b9b0e0}.c-net rect{stroke:#4b4380}.c-head rect{stroke:#5b3fd0;stroke-width:1}.tube{stroke:#5b3fd0}.flow{stroke:#b19bff}.tl{fill:#b19bff}.tl2{fill:#b9b0e0}.note{fill:#9198a1}}</style><defs><linearGradient id="g-head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="head0"/><stop offset="1" class="head1"/></linearGradient><linearGradient id="g-ui" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="ui0"/><stop offset="1" class="ui1"/></linearGradient><linearGradient id="g-hosting" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="hosting0"/><stop offset="1" class="hosting1"/></linearGradient><linearGradient id="g-logic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="logic0"/><stop offset="1" class="logic1"/></linearGradient><linearGradient id="g-core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="core0"/><stop offset="1" class="core1"/></linearGradient><linearGradient id="g-net" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="net0"/><stop offset="1" class="net1"/></linearGradient><linearGradient id="g-tube" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="tube0"/><stop offset="1" class="tube1"/></linearGradient><filter id="lift" x="-10%" y="-30%" width="120%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2a1660" flood-opacity="0.18"/></filter></defs><g class="c-head"><rect x="8" y="8" width="320" height="34" rx="9" fill="url(#g-head)" filter="url(#lift)"/><text x="22" y="30"><tspan class="b">VpnHood! CLIENT</tspan><tspan class="d" dx="8">or your own app</tspan></text></g><g class="c-ui"><rect x="8" y="50" width="320" height="34" rx="9" fill="url(#g-ui)" filter="url(#lift)"/><text x="22" y="72"><tspan class="b">AppUi</tspan><tspan class="d" dx="8">its look and words</tspan></text></g><g class="c-hosting"><rect x="8" y="92" width="320" height="34" rx="9" fill="url(#g-hosting)" filter="url(#lift)"/><text x="22" y="114"><tspan class="b">AppHosting</tspan><tspan class="d" dx="8">runs them on each platform</tspan></text></g><g class="c-logic"><rect x="8" y="134" width="320" height="34" rx="9" fill="url(#g-logic)" filter="url(#lift)"/><text x="22" y="156"><tspan class="b">AppLogic</tspan><tspan class="d" dx="8">its logic</tspan></text></g><g class="c-core"><rect x="8" y="176" width="320" height="34" rx="9" fill="url(#g-core)" filter="url(#lift)"/><text x="22" y="198"><tspan class="b">Core</tspan><tspan class="d" dx="8">the VPN engine</tspan></text></g><g class="c-net"><rect x="8" y="218" width="320" height="34" rx="9" fill="url(#g-net)" filter="url(#lift)"/><text x="22" y="240"><tspan class="b">Net</tspan><tspan class="d" dx="8">networking, no VPN</tspan></text></g><g class="c-head"><rect x="552" y="134" width="320" height="34" rx="9" fill="url(#g-head)" filter="url(#lift)"/><text x="566" y="156"><tspan class="b">VpnHood! SERVER</tspan><tspan class="d" dx="8">or your own server</tspan></text></g><g class="c-core"><rect x="552" y="176" width="320" height="34" rx="9" fill="url(#g-core)" filter="url(#lift)"/><text x="566" y="198"><tspan class="b">Core</tspan><tspan class="d" dx="8">the VPN engine</tspan></text></g><g class="c-net"><rect x="552" y="218" width="320" height="34" rx="9" fill="url(#g-net)" filter="url(#lift)"/><text x="566" y="240"><tspan class="b">Net</tspan><tspan class="d" dx="8">networking, no VPN</tspan></text></g><rect class="tube" x="328" y="184" width="224" height="18"/><line class="flow" x1="338" y1="193" x2="542" y2="193"/><text x="440" y="159" class="b tl" text-anchor="middle">encrypted tunnel</text><text x="440" y="175" class="tl2" text-anchor="middle">looks like web traffic</text><text x="168" y="272" class="note" text-anchor="middle">on your device</text><text x="712" y="272" class="note" text-anchor="middle">on your server</text></svg>
