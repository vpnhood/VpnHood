name: _build_app_ios (reusable)

# Builds the iOS .ipa from the vpnhood/VpnHood monorepo (checked out into code/). Called by
# publish_app.yml (client only today — connect has no iOS project). Runs on the GitHub-hosted
# macos-26 image (Xcode 26.6 + .NET 11). Signing secrets arrive via `secrets: inherit`; when absent
# the build is UNSIGNED (no .ipa, a warning) and the job stays green. Uploads `<app>-ios`.

on:
  workflow_call:
    inputs:
      app:
        description: "client | connect"
        type: string
        required: true
      code_ref:
        type: string
        required: false
        default: ""

env:
  CODE_REPO: vpnhood/VpnHood

jobs:
  build-ios:
    runs-on: macos-26
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      PKG: ${{ inputs.app == 'connect' && 'VpnHoodConnect' || 'VpnHoodClient' }}
      PREFIX: ${{ inputs.app == 'connect' && 'Connect' || 'Client' }}
      # The release repo drives every generated install/update URL (Resolve-PublishRepo otherwise falls
      # back to GITHUB_REPOSITORY, i.e. the CALLER). When the publishing repo is not the release repo —
      # the client publishes from Vpnhood.App.Client but releases into vpnhood/VpnHood — the BUILDS must
      # honour the same override the release job uses, or the shipped JSON points at a repo with no
      # releases and in-app update breaks with nothing going red.
      VH_PUBLISH_REPO: ${{ inputs.app != 'connect' && (vars.VH_PUBLISH_REPO || github.repository) || '' }}
      VH_CONNECT_PUBLISH_REPO: ${{ inputs.app == 'connect' && (vars.VH_CONNECT_PUBLISH_REPO || vars.VH_PUBLISH_REPO || github.repository) || '' }}
      APPLE_DISTRIBUTION_CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
      APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      IOS_PROVISION_APP_BASE64: ${{ secrets.IOS_PROVISION_APP_BASE64 }}
      IOS_PROVISION_EXT_BASE64: ${{ secrets.IOS_PROVISION_EXT_BASE64 }}
      # Connect embeds a default server access key. Keys are per-entitlement: the App Store build has no
      # ads, so it uses the 'premium' key shared by every ad-free distribution. Unused for the client.
      ACCESS_KEY_PREMIUM: ${{ secrets.ACCESS_KEY_PREMIUM }}
    steps:
      - name: Checkout code (${{ env.CODE_REPO }})
        uses: actions/checkout@v5
        with: { repository: "${{ env.CODE_REPO }}", ref: "${{ inputs.code_ref }}", path: code }
      # net11.0-ios needs the .NET 11 preview SDK. Track the preview channel (matches publish_nugets.yml)
      # rather than pinning an exact build, so each new preview (currently preview 7,
      # 11.0.100-preview.7.26381.103, iOS workload 26.5.11997-net11-p7) is picked up automatically.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0"
          dotnet-quality: preview
      - name: Install .NET iOS workload
        shell: pwsh
        run: dotnet workload install ios
      # Pin the Xcode the CURRENT .NET-for-iOS preview demands — the SDK hard-errors when Xcode is older
      # ("requires Xcode 26.6 ... current is 26.5"), and nothing suppresses that check (no
      # ValidateXcodeVersion anywhere in the repo). Because the SDK above floats on the preview channel,
      # this pin has to move with it: when a new preview raises the requirement, that error names the
      # version to put here. The macos-26 image carries 26.0–26.6 side by side, so only this line changes.
      # Verified for preview 7 (2026-08-17): its Microsoft.iOS.Sdk.net11.0_26.5/26.5.11997-net11-p7 pack
      # still declares RecommendedXcodeVersion 26.6, so this pin stays put on the p6 -> p7 move.
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "26.6" }
      - name: Resolve module dir
        shell: pwsh
        run: |
          $v = Get-Content "$env:GITHUB_WORKSPACE/code/pub/PubVersion.json" | ConvertFrom-Json
          $tag = "v$($v.Version)" + ($(if ($v.Prerelease) { "-prerelease" } else { "" }))
          "MODULE_DIR=code/pub/bin/$tag/$env:PKG" | Out-File -FilePath $env:GITHUB_ENV -Append
      # When the secret is absent nothing is written and the strict guard in the publish script
      # (Assert-DefaultAccessKey) FAILS the build — a Connect app with no default server opens on an
      # empty server list, so this must never pass silently.
      - name: Write default access key (connect)
        if: inputs.app == 'connect'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ACCESS_KEY_PREMIUM)) { return }
          $d = Join-Path $env:GITHUB_WORKSPACE ".user/$env:PKG"
          New-Item -ItemType Directory -Path $d -Force | Out-Null
          $env:ACCESS_KEY_PREMIUM | Out-File (Join-Path $d "access_key_premium.txt") -Encoding ascii -Force -NoNewline
      - name: Write publish.json
        if: vars.PUBLISH != ''
        shell: pwsh
        env: { PUBLISH: "${{ vars.PUBLISH }}" }
        run: |
          $u = Join-Path $env:GITHUB_WORKSPACE ".user/$env:PKG"
          New-Item -ItemType Directory -Path $u -Force | Out-Null
          $env:PUBLISH | Out-File (Join-Path $u "publish.json") -Encoding utf8 -Force
      - name: Write appsettings
        shell: pwsh
        env:
          APPSETTINGS: "${{ vars.APPSETTINGS }}"
          PUBLISH: "${{ vars.PUBLISH }}"
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APPSETTINGS)) {
            if (-not [string]::IsNullOrWhiteSpace($env:PUBLISH)) {
              throw "APPSETTINGS variable is not set, but a strict iOS publish (publish.json present) requires .user/$env:PKG/appsettings.json."
            }
            Write-Host "::warning::APPSETTINGS not set and no publish.json; building iOS non-strict."
            return
          }
          $u = Join-Path $env:GITHUB_WORKSPACE ".user/$env:PKG"
          New-Item -ItemType Directory -Path $u -Force | Out-Null
          $env:APPSETTINGS | Out-File (Join-Path $u "appsettings.json") -Encoding utf8 -Force
      - name: Prepare iOS signing
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/code/pub/lib/Initialize-CiIosSigning.ps1" -appFolder $env:PKG
      - name: Build iOS (.ipa)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/code/src/Apps/$env:PREFIX.Ios/_publish.ps1"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app }}-ios
          if-no-files-found: warn
          retention-days: 1
          path: ${{ env.MODULE_DIR }}/ios/**
